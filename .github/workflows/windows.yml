# The engine on Windows, while it's being brought up: on each push to the
# windows branch, or by hand, it builds
# with clang-cl (terragen's fixed point needs __int128) against vcpkg, runs
# the unit tests and keeps the build as an artifact. Folded into release.yml
# once it packages.
name: windows

on:
  push:
    branches: [windows]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp a test build with'
        default: 'dev'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      VERSION: ${{ inputs.version || 'dev' }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.output/vcpkg-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # vcpkg builds every dependency from source: keep what it built.
      # Saved even when a later step fails (below): every run builds on the last.
      - name: Restore vcpkg builds
        uses: actions/cache/restore@v4
        with:
          path: .output/vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: .output/build/_deps
          key: cef-windows64-${{ hashFiles('cmake/Modules/CEF.cmake') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Build the UI
        working-directory: apps/game/ui
        run: |
          bun install --frozen-lockfile
          bun run build

      # clang-cl and the linker need Visual Studio's environment.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The runner's own LLVM, not the older clang-cl bundled with Visual
      # Studio: that one leaves std::variant's destructors undefined at link.
      - name: Configure
        run: |
          LLVM="C:/Program Files/LLVM/bin"
          "$LLVM/clang-cl.exe" --version
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cmake -S . -B .output/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM/clang-cl.exe" -DCMAKE_CXX_COMPILER="$LLVM/clang-cl.exe" \
            -DCMAKE_LINKER="$LLVM/lld-link.exe" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DRUN_IN_PLACE=TRUE \
            -DENABLE_CURSES=OFF -DENABLE_POSTGRESQL=OFF -DENABLE_LEVELDB=OFF \
            -DENABLE_REDIS=OFF -DENABLE_SPATIAL=OFF -DENABLE_PROMETHEUS=OFF \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DTERRAFIRMA_VERSION="$VERSION"

      - name: Save vcpkg builds
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .output/vcpkg-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      # -k 0: one run reports every compile error, not just the first.
      - name: Build the engine
        run: cmake --build .output/build -- -k 0 && bash scripts/stage-runtime.sh

      # Bring-up only: which flag leaves std::variant's destructor undefined.
      # Recompiles one failing file with each suspect removed and asks whether
      # the object still only references it (U) or now defines it.
      - name: Diagnose the variant link error
        if: failure()
        run: |
          cd .output/build
          cmd=$(ninja -t commands luanti.exe | grep -m1 'content_cao.cpp.obj')
          echo "$cmd" | tr ' ' '\n' | grep -E '^[-/]' | grep -vE '^(-I|/I|-imsvc|/external)' | sort -u | tr '\n' ' '; echo
          sym='_Variant_storage_'
          try() {
            label=$1; shift
            c="$cmd"
            for drop in "$@"; do c=${c//"$drop"/}; done
            c=$(echo "$c" | sed -E 's#/Fo[^ ]+#/Fo../probe.obj#; s#-o [^ ]+#-o ../probe.obj#')
            if ! cmd.exe //C "$c" >/dev/null 2>../probe.err; then echo "$label: compile failed"; tail -3 ../probe.err; return; fi
            defined=$("C:/Program Files/LLVM/bin/llvm-nm.exe" ../probe.obj | grep "$sym" | grep -v ' U ' | wc -l)
            undefined=$("C:/Program Files/LLVM/bin/llvm-nm.exe" ../probe.obj | grep "$sym" | grep ' U ' | wc -l)
            echo "$label: $defined defined, $undefined undefined"
          }
          try "as built"
          try "without /EHa" "/EHa"
          try "without the force-include" "/FI$(cygpath -m "$GITHUB_WORKSPACE")/apps/game/src/windows_names.h"
          try "without /Ox" "/Ox"
          try "without /GS-" "/GS-"
          try "without /fp:except-" "/fp:except-"
          try "without /Zi" "/Zi"

      - name: Unit tests
        run: |
          ./.output/bin/luanti.exe --test-module TestOnline
          ./.output/bin/luanti.exe --test-module TestRelease
          ./.output/bin/luanti.exe --test-module TestTerragen

      - name: Keep as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraverse-${{ env.VERSION }}-windows-x86_64-tree
          path: |
            .output/bin
            .output/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
