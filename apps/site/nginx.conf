server {
    listen 8080;
    root /usr/share/nginx/html;
    types { text/html html; text/css css; text/javascript js; application/json json; image/webp webp; image/svg+xml svg; font/woff2 woff2; text/plain sh; }
    gzip on;
    gzip_types text/css text/javascript application/json text/plain image/svg+xml;
    # Behind Cloud Run nginx only knows its own port: never let it build a redirect
    absolute_redirect off;
    error_page 404 /404.html;
    location = /install.sh { add_header Cache-Control "no-cache"; }
    location /_nuxt/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    # Prerendered pages are folders: serve /docs from /docs/index.html, no slash redirect
    location / { add_header Cache-Control "public, max-age=300"; try_files $uri $uri/index.html =404; }
}
