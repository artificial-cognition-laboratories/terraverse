server {
    listen 8080;
    root /usr/share/nginx/html;
    types { text/html html; text/css css; text/javascript js; application/json json; image/webp webp; font/woff2 woff2; text/plain sh; }
    gzip on;
    gzip_types text/css text/javascript application/json text/plain;
    location = /install.sh { add_header Cache-Control "no-cache"; }
    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { add_header Cache-Control "public, max-age=300"; try_files $uri $uri/ =404; }
}
